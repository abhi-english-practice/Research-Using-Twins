sked more than 15,000 questions.", "vi": "Ý tưởng sử dụng các cặp sinh đôi để đo lường ảnh hưởng của sự di truyền có từ năm 1875, khi nhà khoa học người Anh Francis Galton lần đầu tiên đề xuất phương pháp này và đặt ra cụm từ “yếu tố bẩm sinh và sự nuôi dưỡng”. Tuy nhiên, các nghiên cứu về sinh đôi đã có một bước ngoặt bất ngờ vào những năm 1980, với sự xuất hiện của những nghiên cứu về các cặp sinh đôi cùng trứng đã bị chia tách từ khi mới sinh và được đoàn tụ khi trưởng thành. Trong khoảng thời gian hai thập kỷ, tổng cộng 137 cặp sinh đôi cuối cùng đã đến phòng thí nghiệm của Thomas Bouchard để tham gia chương trình nghiên cứu mà sau này được biết đến với tên gọi Nghiên cứu Minnesota về các cặp sinh đôi được nuôi dưỡng riêng biệt. Nhiều bài kiểm tra đã được thực hiện đối với những người sinh đôi và mỗi người được hỏi hơn 15.000 câu hỏi.", "phrases": [{"key": "measure the influence of heredity", "meaning": "đo lường ảnh hưởng của sự di truyền", "loc": [27, 60]}, {"key": "date back to", "meaning": "có nguồn gốc từ, có từ", "loc": [61, 74]}, {"key": "suggest an approach", "meaning": "đề xuất một phương pháp", "loc": [129, 151]}, {"key": "coin a phrase", "meaning": "đặt ra một cụm từ mới", "loc": [157, 174]}, {"key": "take a surprising twist", "meaning": "có một bước ngoặt bất ngờ", "loc": [215, 238]}, {"key": "the arrival of", "meaning": "sự xuất hiện của", "loc": [258, 272]}, {"key": "studies into something", "meaning": "các nghiên cứu về vấn đề gì", "loc": [273, 301]}, {"key": "be separated at birth", "meaning": "bị chia tách từ khi mới sinh", "loc": [310, 333]}, {"key": "be reunited as adults", "meaning": "được đoàn tụ khi trưởng thành", "loc": [338, 356]}, {"key": "over two decades", "meaning": "trong khoảng thời gian hai thập kỷ", "loc": [358, 374]}, {"key": "sets of twins", "meaning": "các cặp sinh đôi", "loc": [379, 392]}, {"key": "become known as", "meaning": "được biết đến với tên gọi", "loc": [442, 457]}, {"key": "be reared apart", "meaning": "được nuôi dưỡ function shuffled(items) {
  const copy = [...items];
  for (let i=copy.length-1; i>0; i--) {

    [copy[i],copy[j]] = [copy[j],copy[i]];

}

function chunkText(p, pi, active) {
  const sorted = p.phrases.map((phrase,i)=>({...phrase,i})).filter(phrase=>phrase.loc)
    .sort((a,b)=>a.loc[0]-b.loc[0] || b.loc[1]-a.loc[1]);

}

function noteHTML(p) {
  return p.notes.map(block=>{
    const t=block.split('\n').map(line=>e(line));
    return '<p>'+t.join('<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/(^|>)\*([^*]+)\*(?=<|$)/g,'$1<em>$2</em>').replace(/&amp;#x20;/g,'')+'</p>';
  }).join('');
}
function linkedNotes(p, key) {
  const stems = {
    'be rooted in heredity':'be rooted in',
    'vulnerability to disease':'vulnerability to',
    'the interplay of nature and nurture':'the interplay',
    'be crucial to understanding':'be crucial to',
    'the key to an approach':'the key to',
    'turn a gene on or off':'turn something on or off',
    'suggest an approach':'suggest an approach',
    'be at work':'factors at work',
  };
  const target=(stems[key.toLowerCase()]||key).toLowerCase();
  const groups=[];
  for (const line of p.notes) {
    const heading=line.match(/^\*\*(.+?)\*\*$/);
    if(heading) groups.push({title:heading[1],lines:[]});
    else groups.at(-1)?.lines.push(line);
  }
  const note=groups.find(group=>group.title.toLowerCase().startsWith(target));
  return note ? noteHTML({notes:note.lines}) : '';
}
function gloss(key) {
  return [...master,...paraphrases].find(item=>item[0].toLowerCase()===key.toLowerCase())?.[1] || '';
}
function chunkCard(p,index,withFind) {
  const phrase = p.phrases[index];
  if (!phrase) return '';
  const source = phrase.loc ? p.en.slice(...phrase.loc) : '';
  const sentencesWithChunk = source ? p.sentences.find(line=>line.en.includes(source))?.en : '';
  const paraphrase = gloss(phrase.key);
  return '<div class="focus-card"><h3 lang="en">'+e(phrase.key)+'</h3><p lang="vi">'+e(phrase.meaning)+'</p>'+
    (paraphrase?'<p><strong>Paraphrase</strong> · '+e(paraphrase)+'</p>':'')+
    (source && source.toLowerCase()!==phrase.key.toLowerCase()?'<p><strong>In the passage</strong> · '+e(source)+'</p>':'')+
    (sentencesWithChunk?'<p>'+e(sentencesWithChunk)+'</p>':'')+
    (withFind?linkedNotes(p,phrase.key):'')+
    (withFind&&source?button('Find in passage','find-chunk',index):'')+'</div>';
}
function quickContent(p) {
  const exercise=quick[ci];
  const indices=priorities[ci];
  const words=indices.map(i=>p.phrases[i]);
  const meanings=[words[1].meaning,words[2].meaning,words[0].meaning];
  const gap=cloze[ci];
  const choiceWords=[gap[2][0],gap[1],gap[2][1]];
  function field(i, label, choices, expected) {
    const value=exercise.values[i];
    const checked=exercise.checked;
    const correct=value===expected;
    return '<label><strong>'+e(label)+'</strong><select data-quick="'+i+'"><option value="">Choose an answer</option>'+
      choices.map(c=>'<option '+(c===value?'selected':'')+'>'+e(c)+'</option>').join('')+'</select></label>'+
      (checked?'<p class="answer-line '+(correct?'positive':'negative')+'">'+e(correct?'Correct':(value?'Answer · ':'Unanswered · ')+expected)+'</p>':'');
  }
  return '<div class="exercise"><fieldset><legend>Match each chunk to its meaning</legend>'+
    words.map((word,i)=>field(i,word.key,meanings,word.meaning)).join('')+'</fieldset>'+
    '<fieldset><legend>Use a chunk in a new sentence</legend>'+field(3,gap[0],choiceWords,gap[1])+'</fieldset></div>'+
    '<div class="actions">'+button('Check','check-quick','','class="primary"')+button('Try Again','retry-quick')+'</div>';
}

function paragraphMarks(p, pi, reveal) {
  const ranges=annotations[pi].map(([a,b])=>({a,b,kind:'manual'}));
  const q=questions[qi];
  if (reveal) {
    q.evidence.forEach((line,i)=>{
      const a=p.en.indexOf(line);
      if(a>=0) ranges.push({a,b:a+line.length,kind:q.key==='NOT GIVEN'?'related':'found',id:'evidence-'+i});
    });
  }
  const breaks=[...new Set([0,p.en.length,...ranges.flatMap(r=>[r.a,r.b])])].sort((a,b)=>a-b);
  return breaks.slice(0,-1).map((a,i)=>{
    const b=breaks[i+1];
    const matches=ranges.filter(r=>r.a<=a && r.b>=b);
    const anchor=matches.find(r=>r.a===a && r.id)?.id;
    return matches.length?'<span '+(anchor?'id="'+anchor+'" ':'')+'class="'+matches.map(r=>r.kind).join(' ')+'">'+e(p.en.slice(a,b))+'</span>':e(p.en.slice(a,b));
  }).join('');
}
function evidenceLink(q) {
  return button(q.key==='NOT GIVEN'?'Find related paragraph':'Find in passage','find-evidence');
}
function explanation(q, response) {
  const correct=q.key===response.value;
  const notGiven=q.key==='NOT GIVEN';
  return '<section class="explanation" aria-label="Explanation"><p role="status" class="result '+(correct?'positive':'negative')+'">'+
    (correct?'Correct':'Incorrect')+' · Answer '+q.key+'</p><h3>Understand the question</h3><p lang="vi">'+e(q.vi)+'</p>'+
    '<h3>Keywords and comparison</h3>'+table(['Question','Reading passage'],q.compare)+
    '<h3>'+(notGiven?'Related text':'Evidence in the passage')+'</h3><div class="evidence-box '+(notGiven?'info':'')+'">'+
    q.evidence.map(line=>'<p>'+e(line)+'</p>').join('')+'<p lang="vi">'+e(q.evidenceVI)+'</p></div>'+evidenceLink(q)+
    '<h3>Why '+q.key+'?</h3><p>'+e(q.whyEN)+'</p><p lang="vi">'+e(q.whyVI)+'</p>'+
    '<details><summary>Vocabulary &amp; Grammar</summary>'+table(['Useful chunk','Nghĩa tiếng Việt'],q.vocab)+
    '<div class="note-card">'+q.grammar.map(line=>'<p>'+e(line)+'</p>').join('')+'</div></details></section>';
}
function resultContent() {
  const checked=answers.filter(a=>a.checked).length;
  const correct=answers.filter((a,i)=>a.checked && a.value===questions[i].key).length;
  return '<h3>'+correct+' / '+questions.length+' correct</h3><p>'+checked+' checked · '+(questions.length-checked)+' unchecked</p>'+
    '<table class="results-table"><thead><tr><th scope="col">Question</th><th scope="col">Your answer</th><th scope="col">Status</th></tr></thead><tbody>'+
    answers.map((a,i)=>'<tr><td>'+button(String(i+1),'question',i)+'</td><td>'+e(a.value||'—')+'</td><td>'+
      (a.checked?(a.value===questions[i].key?'Correct':'Incorrect'):(a.value?'Unchecked':'Unanswered'))+'</td></tr>').join('')+'</tbody></table>'+
    '<div class="actions">'+button('Back to questions','close-results')+'</div>';
}
function practice() {
  const q=questions[qi];
  const a=answers[qi];
  const read=paragraphs.map((p,i)=>'<article class="read-block" id="practice-p'+i+'"><h3>'+e(proname(i))+'</h3>'+
    '<p class="en-copy" data-reading="'+i+'">'+paragraphMarks(p,i,a.checked&&!practiceResults)+'</p>'+
    (practiceVI?'<p class="vi-copy" lang="vi">'+e(p.vi)+'</p>':'')+'</article>').join('');
  const question='<div class="question-card"><p class="mini">Do the following statements agree with the information given in the passage?</p>'+
    '<details><summary>Answer options</summary><p><strong>TRUE</strong> · The passage agrees.</p><p><strong>FALSE</strong> · The passage contradicts the statement.</p><p><strong>NOT GIVEN</strong> · The passage gives insufficient information.</p></details>'+
    '<h3 class="mode-title" style="margin-top:12px">Question '+(qi+1)+'</h3><p>'+e(q.stem)+'</p>'+
    '<div class="choices" role="group" aria-label="Answer choices" style="margin-top:11px">'+options.map(option=>{
      const color=a.checked?(option===q.key?'correct':(option===a.value?'wrong':'')):'';
      return button(option,'answer',option,pressed(a.value===option)+' class="'+color+'"');
    }).join('')+'</div><div class="actions">'+button('Check','check-question','','class="primary" '+(a.value?'':'disabled'))+'</div>'+
    (a.checked?explanation(q,a):'')+'</div>';
  let noteBox='';
  if(noteOpen) noteBox='<div class="note-card"><label for="notes"><strong>Reading notes</strong></label><textarea class="notes" id="notes">'+e(notes)+'</textarea></div>';
  return '<div class="bar">'+button(practiceVI?'Hide Vietnamese':'Show Vietnamese','practice-vi','',pressed(practiceVI))+
    '<span class="spacer"></span>'+button('Highlight selection','highlight')+button('Clear highlights','clear-highlights')+
    button('Notes','notes','',pressed(noteOpen))+'<span class="mini" id="mark-status" role="status"></span></div>'+noteBox+
    '<div class="split">'+pane('Passage',read,'practice-passage',a.checked&&!practiceResults?(q.key==='NOT GIVEN'?'Related text':'Green · Evidence'):'')+
    pane(practiceResults?'Results':'Questions',practiceResults?resultContent():question,'practice-content','Questions 1–4')+'</div>'+
    '<div class="bar" aria-label="Question navigation">'+questions.map((q,i)=>button(String(i+1),'question',i,
      selected(qi===i&&!practiceResults)+' aria-label="Question '+(i+1)+'" class="'+(answers[i].checked?(answers[i].value===q.key?'passed':'missed'):'')+'"')).join('')+
    '<span class="spacer"></span>'+button('← Previous','question',qi-1,qi?'':'disabled')+
    button('Next →','question',qi+1,qi<questions.length-1?'':'disabled')+button('Results','results','','class="primary"')+'</div>';
}

function sentence() {
  const s=sentences[si];
  const b=builds[si];
  const userChunks=b.selected;
  const good=b.status==='correct';
  const complete=builds.filter(x=>x.status==='correct').length;
  const hintIndex=userChunks.findIndex((value,index)=>value!==index);
  const nextIndex=hintIndex===-1?userChunks.length:hintIndex;
  const message={
    correct:'Correct. Your sentence matches the passage.',
    wrong:'This order does not match the original sentence.',
    incomplete:'Add all the chunks before checking.'
  }[b.status] || '';
  return '<section class="card sentence"><div class="sentence-top"><div><p class="mini">'+e(proname(s.pi))+'</p><h2>Sentence '+(si+1)+' / '+sentences.length+'</h2></div>'+
    '<label>Go to sentence <select id="sentence-select">'+sentences.map((_,i)=>'<option value="'+i+'" '+(si===i?'selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label></div>'+
    '<div class="hint"><div class="hint-head"><strong>Vietnamese hint</strong>'+button(b.hideVI?'Show':'Hide','sentence-vi')+'</div>'+
    '<p lang="vi" '+(b.hideVI?'hidden':'')+'>'+e(s.vi)+'</p></div>'+
    '<div class="actions listen-control">'+button('▶ Listen to sentence','listen-sentence','','class="primary"')+button('■ Stop','stop-sentence')+
    '<span class="mini" id="listen-status" role="status"></span></div>'+
    '<div class="answer-zone '+(good?'solved':'')+'" aria-label="Your sentence">'+(userChunks.length?
      userChunks.map(i=>button(s.chunks[i],'remove-chunk',i)).join(''):'<p class="mini">Tap the chunks to build the original sentence.</p>')+'</div>'+
    '<div class="chunks" aria-label="Available chunks">'+b.order.filter(i=>!userChunks.includes(i)).map(i=>button(s.chunks[i],'add-chunk',i)).join('')+'</div>'+
    '<div class="actions">'+button('Check','check-sentence','','class="primary"')+button('Hint','hint-sentence')+
    button('Clear','clear-sentence')+button(b.show?'Hide Answer':'Show Answer','show-sentence')+'</div>'+
    (b.hint&&!good&&nextIndex<s.chunks.length?'<p class="answer-preview">Chunk '+(nextIndex+1)+' · <strong>'+e(s.chunks[nextIndex])+'</strong></p>':'')+
    (message?'<p class="result '+(good?'positive':'negative')+'" role="status">'+e(message)+'</p>':'')+
    (b.show?'<p class="answer-preview"><strong>Original sentence</strong><br>'+e(s.en)+'</p>':'')+
    '<div class="bar" aria-label="Sentence navigation">'+button('← Previous','sentence-nav',si-1,si?'':'disabled')+
    '<span class="spacer"></span><strong>'+complete+' / '+sentences.length+' complete</strong><span class="spacer"></span>'+
    button('Next →','sentence-nav',si+1,si<sentences.length-1?'':'disabled')+'</div></section>';
}

function fill({keep=false}={}) {
  const remembered = keep ? [...main.querySelectorAll('.scroll')].map(n=>[n.id,n.scrollTop]) : [];
  main.innerHTML = {home,coll:collocations,practice,sentence}[mode]();
  remembered.forEach(([id,top])=>{document.getElementById(id).scrollTop=top;});
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
  reset.hidden=mode==='home';
  reset.textContent={coll:'Reset paragraph',practice:'Reset practice',sentence:'Reset sentence'}[mode]||'Reset';
  player.hidden=mode!=='home';
}
function moveTo(el, container) {
  if(!el) return;
  if(container) container.scrollTop=Math.max(0,el.getBoundingClientRect().top-container.getBoundingClientRect().top+container.scrollTop-24);
  if(!container || matchMedia('(max-width:780px)').matches) el.scrollIntoView({block:'nearest'});
}
function homeChunk(pi, id) {
  const target=document.querySelector('#home-meaning-'+pi);
  const alreadyOpen=target.dataset.chunk===String(id) && !target.hidden;
  main.querySelectorAll('.read-block>.focus-card').forEach(card=>card.hidden=true);
  if(alreadyOpen) return;
  target.dataset.chunk=id;
  target.innerHTML=chunkCard(paragraphs[pi],id,false)+'<div class="actions">'+
    button('Open in Collocations','open-coll',pi+':'+id)+'</div>';
  target.hidden=false;
}
function selectChunk(i, fromPassage) {
  activeChunk=i;
  collScreen='learn';
  fill({keep:true});
  if(fromPassage) {
    moveTo(document.querySelector('#active-chunk'),document.querySelector('#coll-content'));
  } else {
    moveTo(document.querySelector('#phrase-'+ci+'-'+i),document.querySelector('#coll-passage'));
    document.querySelector('#vocab-'+i)?.focus({preventScroll:true});
  }
}
function openMode(next) {
  if(mode===next) return;
  stopAudio();
  mode=next;
  fill();
}
function setSentence(i) {
  if(!sentences[i]) return;
  stopAudio();
  si=i;
  fill();
}
function stopAudio() {
  playRequest++;
  clearInterval(sentenceTimer);
  sentenceEnd=null;
  audio.pause();
  const status=document.querySelector('#listen-status');
  if(status) status.textContent='';
  speaking=-1;
}
function listenSentence() {
  stopAudio();
  const request=playRequest;
  const [start,end]=sentences[si].time;
  const run=()=>{
    if(request!==playRequest || mode!=='sentence') return;
    if(!(audio.duration>=end)) {
      const status=document.querySelector('#listen-status');
      if(status) status.textContent='Audio is unavailable.';
      return;
    }
    sentenceEnd=end;
    audio.currentTime=start;
    audio.play().then(()=>{
      if(request!==playRequest) return;
      const status=document.querySelector('#listen-status');
      if(status) status.textContent='Playing this sentence';
      sentenceTimer=setInterval(stopAtBoundary,25);
    }).catch(()=>{
      if(request!==playRequest) return;
      const status=document.querySelector('#listen-status');
      if(status) status.textContent='Audio could not play. Tap to try again.';
    });
  };
  if(audio.readyState>=1) run();
  else audio.addEventListener('loadedmetadata',run,{once:true});
}
function stopAtBoundary() {
  if(sentenceEnd!==null && audio.currentTime>=sentenceEnd) {
    const end=sentenceEnd;
    stopAudio();
    audio.currentTime=end;
  }
}
audio.addEventListener('timeupdate',()=>{
  stopAtBoundary();
  if(mode!=='home') return;
  const match=sentences.find(s=>audio.currentTime>=s.time[0] && audio.currentTime<=s.time[1]);
  const pi=audio.paused?-1:(match?.pi ?? -1);
  if(pi===speaking) return;
  main.querySelector('.now-speaking')?.classList.remove('now-speaking');
  main.querySelector('[data-home-reading="'+pi+'"]')?.classList.add('now-speaking');
  speaking=pi;
});
audio.addEventListener('pause',()=>{main.querySelector('.now-speaking')?.classList.remove('now-speaking');speaking=-1;});
audio.addEventListener('error',()=>{
  document.querySelector('#audio-error').textContent='Could not load reading.mp3.';
  const status=document.querySelector('#listen-status');
  if(status) status.textContent='Could not load reading.mp3.';
});
document.querySelector('#stop-all').addEventListener('click',()=>{stopAudio();if(audio.readyState) audio.currentTime=0;});
rate.addEventListener('change',()=>audio.playbackRate=Number(rate.value));

function highlightSelection() {
  const selection=window.getSelection();
  const range=selection?.rangeCount ? selection.getRangeAt(0) : null;
  function reading(node) {
    return (node.nodeType===1?node:node.parentElement)?.closest('[data-reading]');
  }
  const p=range?reading(range.startContainer):null;
  if(!p || range.collapsed || p!==reading(range.endContainer)) {
    document.querySelector('#mark-status').textContent='Select text within one paragraph.';
    return;
  }
  const before=range.cloneRange();
  before.selectNodeContents(p);
  before.setEnd(range.startContainer,range.startOffset);
  const offset=before.toString().length;
  const end=offset+range.toString().length;
  annotations[Number(p.dataset.reading)].push([offset,end]);
  selection.removeAllRanges();
  fill({keep:true});
  document.querySelector('#mark-status').textContent='Text highlighted.';
}

const actions = {
  'home-paragraph':v=>moveTo(document.querySelector('#home-p'+v)),
  'home-vi':()=>{homeVI=!homeVI;fill();},
  'read-chunk':value=>{
    const [pi,i]=value.split(':').map(Number);
    if(mode==='home') homeChunk(pi,i);
    else selectChunk(i,true);
  },
  'open-coll':value=>{
    [ci,activeChunk]=value.split(':').map(Number);
    collScreen='learn';
    openMode('coll');
  },
  'coll-paragraph':value=>{ci=Number(value);activeChunk=-1;fill();},
  'coll-screen':value=>{collScreen=value;fill({keep:true});},
  'coll-vi':()=>{collVI=!collVI;fill({keep:true});},
  'pick-chunk':value=>selectChunk(Number(value),false),
  'find-chunk':value=>moveTo(document.querySelector('#phrase-'+ci+'-'+value),document.querySelector('#coll-passage')),
  'check-quick':()=>{quick[ci].checked=true;fill({keep:true});},
  'retry-quick':()=>{quick[ci]={values:['','','',''],checked:false};fill({keep:true});},
  'practice-vi':()=>{practiceVI=!practiceVI;fill({keep:true});},
  'question':value=>{qi=Number(value);practiceResults=false;fill();},
  'answer':value=>{answers[qi]={value,checked:false};fill({keep:true});},
  'check-question':()=>{answers[qi].checked=true;fill({keep:true});},
  'find-evidence':()=>{
    const q=questions[qi];
    const target=q.key==='NOT GIVEN'?document.querySelector('#practice-p'+q.paragraph):
      document.querySelector('#evidence-'+(qi===3?1:0));
    moveTo(target,document.querySelector('#practice-passage'));
  },
  'highlight':highlightSelection,
  'clear-highlights':()=>{annotations=paragraphs.map(()=>[]);fill({keep:true});},
  'notes':()=>{noteOpen=!noteOpen;fill({keep:true});if(noteOpen) document.querySelector('#notes').focus();},
  'results':()=>{practiceResults=true;fill();},
  'close-results':()=>{practiceResults=false;fill();},
  'sentence-nav':value=>setSentence(Number(value)),
  'sentence-vi':()=>{builds[si].hideVI=!builds[si].hideVI;fill();},
  'listen-sentence':listenSentence,
  'stop-sentence':stopAudio,
  'add-chunk':value=>{const b=builds[si];b.selected.push(Number(value));b.status='';b.hint=false;fill();},
  'remove-chunk':value=>{const b=builds[si];b.selected=b.selected.filter(i=>i!==Number(value));b.status='';b.hint=false;fill();},
  'check-sentence':()=>{
    const b=builds[si];
    b.status=b.selected.length!==sentences[si].chunks.length?'incomplete':(b.selected.every((i,j)=>i===j)?'correct':'wrong');
    b.hint=false;
    fill();
  },
  'hint-sentence':()=>{builds[si].hint=true;fill();},
  'clear-sentence':()=>{stopAudio();builds[si]=emptyBuild(sentences[si]);fill();},
  'show-sentence':()=>{builds[si].show=!builds[si].show;fill();}
};
document.querySelector('.main-nav').addEventListener('click',event=>{
  const nav=event.target.closest('[data-mode]');
  if(nav) openMode(nav.dataset.mode);
});
main.addEventListener('pointerdown',event=>{
  if(event.target.closest('[data-action=highlight]')) event.preventDefault();
});
main.addEventListener('click',event=>{
  const control=event.target.closest('[data-action]');
  if(!control || control.disabled) return;
  const {action,value}=control.dataset;
  actions[action]?.(value);
  if(!document.contains(control) && document.activeElement===document.body) {
    const replacement=[...main.querySelectorAll('[data-action="'+action+'"]')].find(el=>el.dataset.value===value && !el.disabled);
    (replacement || (action==='add-chunk'?main.querySelector('.chunks button, .answer-zone button'):null))?.focus({preventScroll:true});
  }
});
main.addEventListener('change',event=>{
  const select=event.target;
  if(select.id==='sentence-select') {
    setSentence(Number(select.value));
    document.querySelector('#sentence-select').focus({preventScroll:true});
  }
  if(select.dataset.quick!==undefined) {
    quick[ci].values[Number(select.dataset.quick)]=select.value;
    if(quick[ci].checked) {
      quick[ci].checked=false;
      fill({keep:true});
      main.querySelector('[data-quick="'+select.dataset.quick+'"]').focus({preventScroll:true});
    }
  }
});
main.addEventListener('input', event=>{if(event.target.id==='notes') notes=event.target.value;});
